<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa NFL</title>
  <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="header-top">
      <img src="img/nfl-logo-wallpaper-thumb.jpg" alt="Logo NFL" class="logo-nfl">
      <h1>Pesquisa NFL</h1>
    </div>

    <nav class="menu">
      <ul class="menu-itens">
        <li><a href="#">História da Liga</a></li>
        <li><a href="#">Franquias</a></li>
        <li><a href="#">Curiosidades</a></li>
        <li><a href="#">Notícias</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <form action="#" method="post" enctype="multipart/form-data">

        <div class="form-grid">

          <div class="coluna">

            <fieldset>
              <legend>Dados Pessoais</legend>

              <label for="userName">Nome:</label>
              <input type="text" id="userName" name="userName" placeholder="Digite aqui seu nome" required>

              <label for="age">Idade:</label>
              <input type="number" id="age" name="age" min="12" max="75" required>

              <label for="birthDate">Data de nascimento:</label>
              <input type="date" id="birthDate" name="birthDate">

              <label for="userEmail">E-mail:</label>
              <input type="email" id="userEmail" name="userEmail" placeholder="Digite seu e-mail válido" required>

              <label for="userPhone">Telefone:</label>
              <input type="tel" id="userPhone" name="userPhone" placeholder="(99) 99999-9999">

              <label for="userImage">Upload de Foto:</label>
              <input type="file" id="userImage" name="userImage" accept="image/*">
            </fieldset>

            <fieldset class="destaque">
              <legend>Sua Franquia</legend>

              <label for="team">Para qual franquia você torce?</label>
              <input type="text" id="team" name="team" list="teamList" placeholder="Escolha ou digite o time">
              <datalist id="teamList">
                <option value="Arizona Cardinals"></option>
                <option value="Atlanta Falcons"></option>
                <option value="Baltimore Ravens"></option>
                <option value="Buffalo Bills"></option>
                <option value="Carolina Panthers"></option>
                <option value="Chicago Bears"></option>
                <option value="Cincinnati Bengals"></option>
                <option value="Cleveland Browns"></option>
                <option value="Dallas Cowboys"></option>
                <option value="Denver Broncos"></option>
                <option value="Detroit Lions"></option>
                <option value="Green Bay Packers"></option>
                <option value="Houston Texans"></option>
                <option value="Indianapolis Colts"></option>
                <option value="Jacksonville Jaguars"></option>
                <option value="Kansas City Chiefs"></option>
                <option value="Las Vegas Raiders"></option>
                <option value="Los Angeles Chargers"></option>
                <option value="Los Angeles Rams"></option>
                <option value="Miami Dolphins"></option>
                <option value="Minnesota Vikings"></option>
                <option value="New England Patriots"></option>
                <option value="New Orleans Saints"></option>
                <option value="New York Giants"></option>
                <option value="New York Jets"></option>
                <option value="Philadelphia Eagles"></option>
                <option value="Pittsburgh Steelers"></option>
                <option value="San Francisco 49ers"></option>
                <option value="Seattle Seahawks"></option>
                <option value="Tampa Bay Buccaneers"></option>
                <option value="Tennessee Titans"></option>
                <option value="Washington Commanders"></option>
              </datalist>
            </fieldset>

            <fieldset class="termLgpd">
              <legend>Termos e Condicões: </legend>
              <input type="checkbox" name="userLgpdTerm" id="userLgpdTerm" value="accepted" required>
              <label for="userLgpdTerm">Você aceita participar da pesquisa?</label><br>

            </fieldset>

          </div>


          <div class="coluna">

            <fieldset>
              <legend>Perfil</legend>

              <fieldset class="grupo">
                <legend>Gênero:</legend>
                <div class="opcoes">
                  <label><input type="radio" name="gender" value="masculino"> Masculino</label>
                  <label><input type="radio" name="gender" value="feminino"> Feminino</label>
                  <label><input type="radio" name="gender" value="outro"> Outro</label>
                  <label><input type="radio" name="gender" value="nao-informar"> Prefiro não informar</label>
                </div>
              </fieldset>

              <label for="maritalStatus">Estado civil:</label>
              <select id="maritalStatus" name="maritalStatus">
                <option value="">Selecione...</option>
                <option value="solteiro">Solteiro(a)</option>
                <option value="casado">Casado(a)</option>
                <option value="uniao-estavel">União estável</option>
                <option value="divorciado">Divorciado(a)</option>
                <option value="viuvo">Viúvo(a)</option>
              </select>

              <label for="musicStyle">Estilo de música:</label>
              <input type="text" id="musicStyle" name="musicStyle" list="musicList"
                placeholder="Escolha ou digite o seu">
              <datalist id="musicList">
                <option value="Rock"></option>
                <option value="Pop"></option>
                <option value="Hip Hop / Rap"></option>
                <option value="Eletrônica"></option>
                <option value="Sertanejo"></option>
                <option value="Forró"></option>
                <option value="MPB"></option>
                <option value="Pagode"></option>
                <option value="Funk"></option>
                <option value="Country"></option>
                <option value="Jazz"></option>
                <option value="Metal"></option>
              </datalist>
            </fieldset>

            <fieldset>
              <legend>Localização</legend>

              <label for="city">Cidade onde reside:</label>
              <input type="text" id="city" name="city" placeholder="Ex: Fortaleza">

              <label for="state">Estado:</label>
              <select id="state" name="state">
                <option value="">Selecione</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
              </select>
            </fieldset>

            <fieldset>
              <legend>Redes Sociais</legend>

              <label for="instagram">Instagram:</label>
              <input type="text" id="instagram" name="instagram" placeholder="@seuusuario">

              <label for="twitter">X (Twitter):</label>
              <input type="text" id="twitter" name="twitter" placeholder="@seuusuario">

              <label for="tiktok">TikTok:</label>
              <input type="text" id="tiktok" name="tiktok" placeholder="@seuusuario">
            </fieldset>

          </div>
        </div>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
      </form>
    </section>
  </main>

  <footer>
    <h4>Desenvolvido por <em>Breno Cordeiro</em> para treinar curso da Alura.</h4>
  </footer>
</body>

</html>
